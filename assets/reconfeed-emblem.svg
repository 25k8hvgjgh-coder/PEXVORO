<linearGradient id="letters" x1="0" y1="0" x2=".2" y2="1"><stop stop-color="#ffffff"/><stop offset=".34" stop-color="#e2e5de"/><stop offset=".54" stop-color="#89938c"/><stop offset=".72" stop-color="#f4f4e9"/><stop offset="1" stop-color="#566059"/></linearGradient>
