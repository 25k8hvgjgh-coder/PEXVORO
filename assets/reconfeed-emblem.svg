<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
<title id="title">ReconFeed military-inspired helmet and shield badge</title>
<desc id="desc">Silver tactical helmet and visor inside a layered olive gold chevron shield, faded American flag and metallic ReconFeed wordmark.</desc>
<defs>
