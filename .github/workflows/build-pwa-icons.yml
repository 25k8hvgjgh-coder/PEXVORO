name: Build ReconFeed home-screen icons

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "assets/reconfeed-emblem.svg"
      - ".github/workflows/build-pwa-icons.yml"

permissions:
  contents: write

jobs:
  build-icons:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Render PNG icons from the ReconFeed emblem
        run: |
          python -m pip install --disable-pip-version-check cairosvg
          python - <<'PY'
          import cairosvg
          source = "assets/reconfeed-emblem.svg"
          outputs = [
              ("assets/reconfeed-icon-192.png", 192, 192),
              ("assets/reconfeed-icon-512.png", 512, 512),
              ("assets/reconfeed-apple-touch-icon.png", 180, 180),
          ]
          for path, width, height in outputs:
              cairosvg.svg2png(url=source, write_to=path, output_width=width, output_height=height)
              print(f"Rendered {path} ({width}x{height})")
          PY

      - name: Commit generated icons
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/reconfeed-icon-192.png assets/reconfeed-icon-512.png assets/reconfeed-apple-touch-icon.png
          if git diff --cached --quiet; then
            echo "Generated icons are already current."
            exit 0
          fi
          git commit -m "Update Recon Tactical home-screen icons"
          # Other validated app commits may land while the icons are being rendered.
          # Rebase the icon-only commit rather than failing on a non-fast-forward push.
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then
              echo "Updated icons published successfully."
              exit 0
            fi
            echo "Concurrent main update detected; retrying icon publication ($attempt/5)."
            sleep 2
          done
          echo "::error::Could not publish refreshed home-screen icons after five attempts."
          exit 1
