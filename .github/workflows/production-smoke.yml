name: ReconFeed production website smoke test

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "api/**"
      - "manifest.webmanifest"
      - "vercel.json"
      - "mobile/**"
      - "scripts/build-web.mjs"
      - "scripts/production-smoke.mjs"
      - ".github/workflows/production-smoke.yml"

permissions:
  contents: read

jobs:
  production-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify live ReconFeed website and backend without paid calls
        run: node scripts/production-smoke.mjs
