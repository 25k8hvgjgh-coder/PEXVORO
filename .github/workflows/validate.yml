name: PEXVORO validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  mobile-typecheck:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run typecheck
      - name: Check responsive website and app layout contracts
        run: node ../scripts/responsive-layout-test.mjs
      - name: Verify legal disclosure pages and signup terms
        run: node ../scripts/legal-disclosures-test.mjs
      - name: Check full-video feed slideshow paging
        run: node ../scripts/feed-slide-test.mjs
      - name: Check fast startup and first-video rendering
        run: node ../scripts/fast-startup-test.mjs
      - name: Check fast visual assets and lightweight profile gallery
        run: node ../scripts/media-loading-regression-test.mjs
      - name: Check inbox, report and PWA reliability contracts
        run: node ../scripts/reliability-regression-test.mjs
      - name: Check Story and screenshot reliability
        run: node ../scripts/story-and-report-test.mjs
      - name: Verify profile photo preparation and upload
        run: node ../scripts/profile-photo-test.mjs
      - name: Build the browser app and landing page
        run: node ../scripts/build-web.mjs

  api-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate API JavaScript syntax
        run: |
          find api -name '*.js' -print0 | xargs -0 -n1 node --check
