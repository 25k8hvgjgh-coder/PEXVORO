name: PEXVORO validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  mobile-typecheck:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm install
      - run: npm run typecheck

  api-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate API JavaScript syntax
        run: |
          node --check api/health.js
          node --check api/generate.js
          node --check api/generation-status.js
