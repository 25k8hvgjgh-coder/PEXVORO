name: Build ReconFeed installable Android APK with EAS

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "mobile/**"
      - ".github/workflows/build-eas-android-apk.yml"

jobs:
  build-android-apk:
    name: Diagnose and build signed Android APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Generate required PNG app icon from committed ReconFeed emblem
        run: |
          python -m pip install --user cairosvg
          python - <<'PY'
          import cairosvg
          cairosvg.svg2png(url="assets/reconfeed-emblem.svg", write_to="assets/icon.png", output_width=1024, output_height=1024)
          print("Generated assets/icon.png from assets/reconfeed-emblem.svg")
          PY

      - name: Check Expo config and assets
        run: |
          node -e "const fs=require('fs'); const c=require('./app.json').expo; console.log('App:',c.name,'Expo package:',require('./package.json').dependencies.expo); for (const p of [c.icon,c.android?.adaptiveIcon?.foregroundImage]) { if (p && p.startsWith('.') && !fs.existsSync(p)) { console.error('Missing configured asset:',p); process.exitCode=1; } }"
          npx expo config --type public
          npx expo-doctor

      - name: Verify generated Android project
        run: npx expo prebuild --platform android --no-install --clean

      - name: Set up Expo and EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Verify Expo authentication
        run: npx eas-cli whoami
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Build signed installable APK
        run: npx eas-cli build --platform android --profile preview --non-interactive --wait
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
