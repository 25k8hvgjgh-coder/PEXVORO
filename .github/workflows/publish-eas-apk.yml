name: Publish stable ReconFeed Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "mobile/**"
      - ".github/workflows/publish-eas-apk.yml"

concurrency:
  group: reconfeed-stable-android-release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Generate native app icon asset
        run: |
          npm install --no-save sharp
          node -e "require('sharp')('assets/reconfeed-emblem.svg').resize(1024,1024).png().toFile('assets/icon.png')"

      - name: Set up Expo and EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Verify Expo authentication
        run: npx eas-cli whoami
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Build current main as a signed preview APK
        shell: bash
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          set -euo pipefail
          BUILD_LOG="$RUNNER_TEMP/reconfeed-eas-build.log"
          set -o pipefail
          npx eas-cli build --platform android --profile preview --non-interactive --wait 2>&1 | tee "$BUILD_LOG"
          BUILD_ID="$(grep -Eo 'builds/[0-9a-fA-F-]{36}' "$BUILD_LOG" | tail -n 1 | cut -d/ -f2 || true)"
          if [ -z "$BUILD_ID" ]; then
            echo "::error::EAS build completed but the build ID could not be read from the log."
            tail -100 "$BUILD_LOG"
            exit 1
          fi
          echo "EAS_BUILD_ID=$BUILD_ID" >> "$GITHUB_ENV"
          echo "Built EAS Android build $BUILD_ID"

      - name: Download and validate the EAS-signed APK
        shell: bash
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          set -euo pipefail
          DOWNLOAD_LOG="$RUNNER_TEMP/reconfeed-eas-download.log"
          npx eas-cli build:download --build-id "$EAS_BUILD_ID" --non-interactive 2>&1 | tee "$DOWNLOAD_LOG"
          APK_PATH="$(grep -Eo '/[^[:space:]]+\.apk' "$DOWNLOAD_LOG" | tail -n 1 || true)"
          if [ -z "$APK_PATH" ] || [ ! -s "$APK_PATH" ]; then
            APK_PATH="$(find /tmp/runner/eas-cli-nodejs/eas-build-run-cache "$RUNNER_TEMP" -type f -name "*_${EAS_BUILD_ID}.apk" -print -quit 2>/dev/null || true)"
          fi
          if [ -z "$APK_PATH" ] || [ ! -s "$APK_PATH" ]; then
            echo "::error::The EAS download completed but the signed APK was not found."
            tail -80 "$DOWNLOAD_LOG"
            exit 1
          fi
          cp "$APK_PATH" "$GITHUB_WORKSPACE/ReconFeed-beta.apk"
          file "$GITHUB_WORKSPACE/ReconFeed-beta.apk"
          unzip -t "$GITHUB_WORKSPACE/ReconFeed-beta.apk" | tail -2
          test -s "$GITHUB_WORKSPACE/ReconFeed-beta.apk"

      - name: Publish the persistent-signature APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-eas-beta
          name: ReconFeed Android Beta (signed)
          body: |
            Latest ReconFeed Android beta. This APK is signed with the persistent EAS Android signing credential so future beta updates can install over this build.

            Download ReconFeed-beta.apk below. This is a beta build, not a Google Play release.
            Users who installed an earlier temporary-key beta may need a one-time uninstall/reinstall. Their server-side account data remains in Supabase; local app-only data may be lost.
          prerelease: true
          make_latest: false
          overwrite_files: true
          files: ${{ github.workspace }}/ReconFeed-beta.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
