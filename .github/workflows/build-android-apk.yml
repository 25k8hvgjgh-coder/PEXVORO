name: Build ReconFeed Android beta APK

on:
  push:
    branches: [main]
    paths:
      - "mobile/**"
      - ".github/workflows/build-android-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-beta-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -path '*/bin/sdkmanager' -type f | sort -V | tail -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "::error::Android SDK command-line tools not found on runner."
            exit 1
          fi
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Install dependencies
        run: npm install

      - name: Generate ReconFeed app icon
        run: |
          npm install --no-save sharp
          node -e "require('sharp')('assets/reconfeed-emblem.svg').resize(1024,1024).png().toFile('assets/icon.png')"

      - name: Generate native Android project
        run: npx expo prebuild --platform android --non-interactive --clean
        env:
          EXPO_PUBLIC_SUPABASE_URL: https://ojprsyvkzgyphpsvksgx.supabase.co
          EXPO_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_mhVX66Gl1F0x6WMgORilRw_QWjOrusW

      - name: Build bundled release APK
        run: cd android && ./gradlew --no-daemon assembleRelease
        env:
          EXPO_PUBLIC_SUPABASE_URL: https://ojprsyvkzgyphpsvksgx.supabase.co
          EXPO_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_mhVX66Gl1F0x6WMgORilRw_QWjOrusW

      - name: Sign APK for beta installation
        shell: bash
        run: |
          set -euo pipefail
          OUT="android/app/build/outputs/apk/release"
          echo "Release APK candidates:"
          find "$OUT" -maxdepth 1 -type f -name '*.apk' -printf '%f\n'
          APK="$(find "$OUT" -maxdepth 1 -type f -name '*.apk' ! -name '*aligned*' ! -name '*beta*' | head -n 1)"
          if [ -z "$APK" ]; then
            echo "::error::Gradle finished but no release APK was found."
            exit 1
          fi
          KEYSTORE="$RUNNER_TEMP/reconfeed-beta.keystore"
          keytool -genkeypair -noprompt -keystore "$KEYSTORE" -storepass reconfeed-beta -alias reconfeed -keypass reconfeed-beta -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=ReconFeed Beta, OU=Beta, O=ReconFeed, L=Denton, ST=Texas, C=US"
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          if [ -z "$BUILD_TOOLS" ] || [ ! -x "$BUILD_TOOLS/zipalign" ] || [ ! -x "$BUILD_TOOLS/apksigner" ]; then
            echo "::error::Android zipalign/apksigner tools were not found."
            exit 1
          fi
          "$BUILD_TOOLS/zipalign" -f -p 4 "$APK" "$OUT/reconfeed-beta-aligned.apk"
          "$BUILD_TOOLS/apksigner" sign --ks "$KEYSTORE" --ks-key-alias reconfeed --ks-pass pass:reconfeed-beta --key-pass pass:reconfeed-beta --out "$OUT/ReconFeed-beta.apk" "$OUT/reconfeed-beta-aligned.apk"
          "$BUILD_TOOLS/apksigner" verify "$OUT/ReconFeed-beta.apk"
          echo "Signed APK size: $(du -h "$OUT/ReconFeed-beta.apk" | cut -f1)"

      - name: Upload installable beta APK
        uses: actions/upload-artifact@v4
        with:
          name: ReconFeed-Android-Beta-APK
          path: mobile/android/app/build/outputs/apk/release/ReconFeed-beta.apk
          if-no-files-found: error
          retention-days: 14
