# Android beta build: tolerate invalid pasted keystore secrets so a test APK can still be produced.
name: Build ReconFeed Android beta APK

on:
  push:
    branches: [main]
    paths:
      - "mobile/**"
      - ".github/workflows/build-android-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android-beta-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -path '*/bin/sdkmanager' -type f | sort -V | tail -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "::error::Android SDK command-line tools not found on runner."
            exit 1
          fi
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Install dependencies
        run: npm install

      - name: Generate ReconFeed app icon
        run: |
          npm install --no-save sharp
          node -e "require('sharp')('assets/reconfeed-emblem.svg').resize(1024,1024).png().toFile('assets/icon.png')"

      - name: Generate native Android project
        run: npx expo prebuild --platform android --non-interactive --clean
        env:
          EXPO_PUBLIC_SUPABASE_URL: https://ojprsyvkzgyphpsvksgx.supabase.co
          EXPO_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_mhVX66Gl1F0x6WMgORilRw_QWjOrusW

      - name: Build bundled release APK
        run: cd android && ./gradlew --no-daemon assembleRelease
        env:
          EXPO_PUBLIC_SUPABASE_URL: https://ojprsyvkzgyphpsvksgx.supabase.co
          EXPO_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_mhVX66Gl1F0x6WMgORilRw_QWjOrusW

      - name: Sign APK for beta installation
        shell: bash
        env:
          RECONFEED_ANDROID_KEYSTORE_BASE64: ${{ secrets.RECONFEED_ANDROID_KEYSTORE_BASE64 }}
          RECONFEED_ANDROID_STORE_PASSWORD: ${{ secrets.RECONFEED_ANDROID_STORE_PASSWORD }}
          RECONFEED_ANDROID_KEY_ALIAS: ${{ secrets.RECONFEED_ANDROID_KEY_ALIAS }}
          RECONFEED_ANDROID_KEY_PASSWORD: ${{ secrets.RECONFEED_ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          OUT="android/app/build/outputs/apk/release"
          APK="$(find "$OUT" -maxdepth 1 -type f -name '*.apk' ! -name '*aligned*' ! -name '*beta*' | head -n 1)"
          if [ -z "$APK" ]; then
            echo "::error::Gradle finished but no release APK was found."
            exit 1
          fi
          KEYSTORE="$RUNNER_TEMP/reconfeed-beta.keystore"
          STORE_PASS="${RECONFEED_ANDROID_STORE_PASSWORD:-}"
          KEY_ALIAS="${RECONFEED_ANDROID_KEY_ALIAS:-}"
          KEY_PASS="${RECONFEED_ANDROID_KEY_PASSWORD:-}"
          PERSISTENT_KEY=false

          # Prefer the permanent key so later beta builds can update an existing install.
          # If the saved secret is absent or malformed, still produce a fresh-install test APK.
          if [ -n "${RECONFEED_ANDROID_KEYSTORE_BASE64:-}" ] && [ -n "$STORE_PASS" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASS" ]; then
            if printf '%s' "$RECONFEED_ANDROID_KEYSTORE_BASE64" | tr -d '[:space:]' | base64 --decode > "$KEYSTORE" 2>/dev/null &&
               keytool -list -keystore "$KEYSTORE" -storepass "$STORE_PASS" -alias "$KEY_ALIAS" >/dev/null 2>&1; then
              PERSISTENT_KEY=true
            fi
          fi

          if [ "$PERSISTENT_KEY" = true ]; then
            echo "Using verified persistent ReconFeed beta signing key."
          else
            echo "::warning::Permanent Android signing secrets are missing or invalid. Creating a one-run beta key; this APK is for a fresh install and may not update an APK signed by another key."
            rm -f "$KEYSTORE"
            STORE_PASS="$(openssl rand -hex 16)"
            KEY_PASS="$STORE_PASS"
            KEY_ALIAS="reconfeed-beta"
            keytool -genkeypair -v -keystore "$KEYSTORE" -storepass "$STORE_PASS" -alias "$KEY_ALIAS" -keypass "$KEY_PASS" -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=ReconFeed Beta, OU=Testing, O=ReconFeed, L=Denton, ST=Texas, C=US" >/dev/null 2>&1
          fi

          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          if [ -z "$BUILD_TOOLS" ] || [ ! -x "$BUILD_TOOLS/zipalign" ] || [ ! -x "$BUILD_TOOLS/apksigner" ]; then
            echo "::error::Android zipalign/apksigner tools were not found."
            exit 1
          fi
          "$BUILD_TOOLS/zipalign" -f -p 4 "$APK" "$OUT/reconfeed-beta-aligned.apk"
          "$BUILD_TOOLS/apksigner" sign --ks "$KEYSTORE" --ks-key-alias "$KEY_ALIAS" --ks-pass "pass:$STORE_PASS" --key-pass "pass:$KEY_PASS" --out "$OUT/ReconFeed-beta.apk" "$OUT/reconfeed-beta-aligned.apk"
          "$BUILD_TOOLS/apksigner" verify "$OUT/ReconFeed-beta.apk"
          echo "Signed APK size: $(du -h "$OUT/ReconFeed-beta.apk" | cut -f1)"

      - name: Upload installable beta APK
        uses: actions/upload-artifact@v4
        with:
          name: ReconFeed-Android-Beta-APK
          path: mobile/android/app/build/outputs/apk/release/ReconFeed-beta.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish beta APK release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-beta-${{ github.run_number }}
          name: ReconFeed Android Beta ${{ github.run_number }}
          body: |
            Installable ReconFeed Android beta build.

            Download `ReconFeed-beta.apk` below. This is a beta build, not a Google Play release.
          files: mobile/android/app/build/outputs/apk/release/ReconFeed-beta.apk
          prerelease: true
          make_latest: true
